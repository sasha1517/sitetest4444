<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Деталі категорії</title>
    <style>
        body { background: #111827; color: #f9fafb; font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; flex-direction: column; }
        .box { text-align: center; background: #1f2937; padding: 40px; border-radius: 15px; border: 1px solid #374151; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { color: #10b981; margin-bottom: 15px; }
        p { color: #d1d5db; font-size: 1.1rem; line-height: 1.6; }
        a { color: #9ca3af; text-decoration: none; margin-top: 25px; display: inline-block; font-weight: bold; transition: 0.2s; }
        a:hover { color: #10b981; }
    </style>
</head>
<body>

    <div class="box">
        <h1>Категорія: {{ category.title }}</h1>
        
        {% if category.image_url %}
            <img src="{{ category.image_url }}" alt="{{ category.title }}" style="width:100%; max-height:250px; object-fit:cover; border-radius:10px; margin-bottom:20px;">
        {% endif %}
        
        <p>{{ category.description }}</p>

        <a href="/">← Назад до категорій</a>
    </div> 

</body>
</html>
